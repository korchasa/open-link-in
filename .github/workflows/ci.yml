name: CI

# Checks only. This workflow builds, lints and tests; it never signs, packages
# or uploads anything — that happens outside this repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A re-push to the same ref makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    # Bound the job so a hang fails instead of idling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Deno is the repository's command runner: every verb is `deno task <verb>`.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Show toolchain
        run: |
          swift --version
          swift format --version
          deno --version

      - name: Verify (build + comment-scan + format + tests)
        run: deno task check
